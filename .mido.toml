# .mido.toml — guardrails gate configuration
version = 1

[size]
tool         = "tokei"
file_loc     = { warn = 300, fail = 500 }
function_loc = { warn = 40,  fail = 60  }
complexity   = { warn = 10,  fail = 15  }
nesting      = { warn = 3,   fail = 4   }

[analysis]
tool          = "rust-code-analysis"
mi_min        = 20
cognitive_max = 15

# web — vite + vitest, oxlint for lint, tsc for types
[targets.web.syntax]
format    = ["npx", "--no-install", "prettier", "--check", "."]
lint      = ["npx", "oxlint"]
typecheck = ["npx", "tsc", "-b"]

[targets.web.tests]
command      = ["npx", "vitest", "run"]
timeout_secs = 900

[targets.web.coverage]
command      = ["npx", "vitest", "run", "--coverage", "--coverage.reporter=lcov", "--coverage.reportsDirectory=coverage"]
coverage_min = 80

# stryker ignores the repo's stryker.config.json here: mido layers it through an
# `extends` key stryker does not implement, so the runner and the timeout come
# from these flags instead. Drop them once mido merges the repo config itself.
[targets.web.mutation]
command = ["npx", "--no-install", "stryker", "run", "--testRunner", "vitest", "--timeoutMS", "30000"]

# api — nest + vitest e2e (postgres), oxlint --type-aware for lint, tsc for types
[targets.api.syntax]
format    = ["npx", "--no-install", "prettier", "--check", "src", "test"]
lint      = ["npx", "oxlint", "--type-aware", "src/", "test/"]
typecheck = ["npx", "tsc", "--noEmit", "-p", "tsconfig.json"]

[targets.api.tests]
command      = ["npx", "vitest", "run", "--config", "./vitest.config.e2e.ts"]
timeout_secs = 900

[targets.api.coverage]
command      = ["npx", "vitest", "run", "--config", "./vitest.config.e2e.ts", "--coverage", "--coverage.reporter=lcov", "--coverage.reportsDirectory=coverage"]
coverage_min = 80

# The unit suite is the only one stryker can drive without the repo config (same
# `extends` gap as web), so the sweep covers what that suite covers: the tag
# parser. Widen it to the e2e suite once mido merges stryker.config.json.
[targets.api.mutation]
command = ["npx", "--no-install", "stryker", "run", "--testRunner", "vitest", "--timeoutMS", "30000", "--mutate", "src/dumps/tag-parser.ts"]

[failure]
max_attempts_per_gate = 3
